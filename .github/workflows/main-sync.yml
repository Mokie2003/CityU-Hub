name: Sync main

# main 每次推送后刷新 README 贡献者名单，并把 main 合并进 feature；每周一凌晨再定时刷一次
# （贡献者的提交数会涨，名单要跟着更新）。
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * 0' # 周一 04:00（北京时间）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-writer
  cancel-in-progress: false

jobs:
  sync:
    name: 刷新名单并同步 feature
    # 机器人自己推的名单提交带 [skip-contrib]，跳过整轮避免自我循环。
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-contrib]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 配置 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 刷新名单并在最新远端基线上提交
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 每轮先对齐远端再生成，基线永远等于远端 HEAD，push 必定快进，不会 rebase 冲突。
          for attempt in 1 2 3; do
            echo "=== 第 ${attempt} 次尝试 ==="

            git fetch origin main
            git reset --hard origin/main

            node scripts/update-contributors.mjs

            if git diff --quiet -- README.md; then
              echo "贡献者信息无变化，跳过提交"
              exit 0
            fi

            git add README.md
            git commit -m "chore(contributors): 刷新贡献者头像墙与名单 [skip-contrib]"

            if git push origin main; then
              echo "已推送到 main"
              exit 0
            fi

            echo "推送被拒：远端在生成期间有了新提交，重新对齐后重试"
            sleep 5
          done

          echo "连续 3 次推送失败，放弃" >&2
          exit 1

      - name: 把 main 同步进 feature
        run: |
          git fetch origin main feature
          git checkout -B feature origin/feature
          git merge --no-edit origin/main
          git push origin feature
