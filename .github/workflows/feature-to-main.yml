name: Sync feature into main

# 目标分支为 feature 的项目 PR 被合并后自动执行：
#   1) 把 main 同步进 feature；
#   2) 把 feature 合入 main（触发站点重建）；
#   3) 在原 PR 下留言感谢投稿。
#
# 为什么用 pull_request_target 而不是 pull_request：
# fork 提交的 PR 在 pull_request 事件下拿到的是只读 token、也拿不到 secrets，
# 推分支与留言都会 403；pull_request_target 在 base 仓库上下文运行，有写权限。
# 本工作流只对仓库自身的分支做 fetch / merge / push，不会 checkout 或执行 PR 里的代码。
#
# 一次性仓库设置：
#   - Settings → Actions → General → Workflow permissions 选 “Read and write permissions”；
#   - main / feature 若有保护规则，需允许 github-actions[bot] 绕过或关闭 “Require a pull request”。
on:
  pull_request_target:
    types: [closed]
    branches: [feature]

permissions:
  contents: write
  issues: write
  pull-requests: write

# 多个 PR 连续合并时串行处理，避免同时改两个分支
concurrency:
  group: feature-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: 同步 feature 并合入 main
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: 取仓库代码（只取 base 仓库的 main，不取 PR 代码）
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 配置 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 把 main 同步进 feature
        run: |
          git fetch origin main feature
          git checkout -B feature origin/feature
          git merge --no-edit origin/main
          git push origin feature

      - name: 把 feature 合入 main
        run: |
          git checkout main
          git merge --no-edit feature
          git push origin main

      - name: 在原 PR 下留言
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '感谢同学的支持！你的项目已经成功被收录，可以进入网站查看，再次感谢您对CityU Hub的贡献🎉',
              '',
              '站点：https://cityu-hub.bond',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
