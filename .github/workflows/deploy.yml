name: Sync & rebuild

# 有人推送到 main 时：
#   1. verify  —— 在 GitHub 托管的 runner 上确认后端、前端都能构建通过
#   2. sync    —— 由目标机器（本地或服务器上的 self-hosted runner）拉取最新代码并重建前后端
#
# ── 一次性配置 ────────────────────────────────────────────────────────────────
# 1) 在目标机器上注册 self-hosted runner（GitHub → Settings → Actions → Runners →
#    New self-hosted runner），标签带上 cityu-hub：
#      mkdir -p ~/actions-runner && cd ~/actions-runner
#      curl -o runner.tar.gz -L <页面给出的下载地址> && tar xzf runner.tar.gz
#      ./config.sh --url https://github.com/Warpshlczy/CityU-Hub --token <页面给出的 token> --labels cityu-hub
#      ./run.sh                      # 前台试跑，确认能连上
#      ./svc.sh install && ./svc.sh start   # 注册为开机自启服务
#
# 2) 仓库 Settings → Secrets and variables → Actions → Variables 里添加：
#      ENABLE_SELF_HOSTED = true    # 不设置时只跑构建验证，不会排队等 runner
#      REPO_PATH          = /Users/mac/Documents/CityU-Hub   # 目标机器上的仓库绝对路径
#                                    # 留空则同步 runner 自己的检出目录
#      RESTART_CMD        = pm2 restart cityu-hub            # 可选：重建后重启后端服务
#
# 3) Secrets 里可选添加：
#      REBUILD_GITHUB_TOKEN = <PAT>  # 有则后端走在线构建，补齐 stars / 语言 / 描述
#
# ── 不想装 runner？用本机定时任务轮询同样可以 ─────────────────────────────────
#   crontab -e  加入（每 5 分钟检查一次，代码没变时会直接跳过，开销极小）：
#     */5 * * * * REPO_PATH="$HOME/Documents/CityU-Hub" /bin/bash "$HOME/Documents/CityU-Hub/scripts/sync-and-build.sh" >> "$HOME/cityu-hub-sync.log" 2>&1

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 代码已是最新时也强制重建
        type: boolean
        default: false

concurrency:
  group: sync-rebuild-${{ github.ref }}

jobs:
  verify:
    name: 构建验证（前端 + 后端）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            back-end/package-lock.json
            front-end/package-lock.json

      - name: 后端：数据校验 + 离线构建
        working-directory: back-end
        run: |
          npm ci --no-audit --no-fund
          npm run validate
          npm run build:offline

      - name: 前端：类型检查 + 构建
        working-directory: front-end
        run: |
          npm ci --no-audit --no-fund
          npm run build

  sync:
    name: 目标机器拉取并重建
    needs: verify
    if: vars.ENABLE_SELF_HOSTED == 'true'
    runs-on: [self-hosted, cityu-hub]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 拉取最新代码并重建前后端
        env:
          REPO_PATH: ${{ vars.REPO_PATH }}
          FORCE: ${{ inputs.force }}
          RESTART_CMD: ${{ vars.RESTART_CMD }}
          GITHUB_TOKEN: ${{ secrets.REBUILD_GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/scripts/sync-and-build.sh"
