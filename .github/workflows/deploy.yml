name: Sync & rebuild (self-hosted)

# 在目标机器（本地电脑或服务器）上拉取最新代码并重建站点，跑在 self-hosted runner 上。
# Vercel 侧不需要这个工作流，它由 Git 集成自动构建。
#
# 仓库 Variables 需设 ENABLE_SELF_HOSTED=true，不设时整个工作流直接跳过、不会排队等 runner；
# REPO_PATH 是目标机器上的仓库绝对路径，RESTART_CMD 可选，重建后重启服务。
# Secrets 里可选加 REBUILD_GITHUB_TOKEN，有则走在线解析补齐 stars / 语言 / 头像。
# 不想装 runner，也可以用 crontab 定时跑 scripts/sync-and-build.sh。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 代码已是最新时也强制重建
        type: boolean
        default: false

concurrency:
  group: sync-rebuild-${{ github.ref }}

jobs:
  sync:
    name: 目标机器拉取并重建
    if: vars.ENABLE_SELF_HOSTED == 'true'
    runs-on: [self-hosted, cityu-hub]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 拉取最新代码并重建站点
        env:
          REPO_PATH: ${{ vars.REPO_PATH }}
          FORCE: ${{ inputs.force }}
          RESTART_CMD: ${{ vars.RESTART_CMD }}
          GITHUB_TOKEN: ${{ secrets.REBUILD_GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/scripts/sync-and-build.sh"
