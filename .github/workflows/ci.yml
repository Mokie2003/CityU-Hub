name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 校验 + 构建
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 校验 repos/*.md
        run: npm run validate

      - name: 单元测试（解析器 + /api 函数）
        run: npm test

      - name: 构建站点（解析 Markdown + 类型检查 + 打包 + 预渲染）
        run: npm run build

      - name: 检查构建产物
        run: |
          test -f web/dist/index.html
          test -f web/dist/data/projects.json
          # 预渲染产物，缺了说明预渲染没生效
          test -f web/dist/sitemap.xml
          test -f web/dist/robots.txt
