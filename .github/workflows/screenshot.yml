name: Screenshot

# 每次推送到 main 后重新抓一张站点首页截图，覆盖 web/public/screenshot.png，
# 并在 README 的 <!-- screenshot:start --> 区块里标注截图时间与截图者
# （固定写 github-actions[bot]，与提交者一致）。
# 截图只是资源替换，不需要再跑一遍构建，所以提交时不带 [skip ci]。
#
# 提交策略：先把工作区对齐到 fetch 到的最新 origin/main，再生成截图与标注。
# 这样提交基线永远等于远端 HEAD，push 一定是快进，不会出现 rebase 冲突
# ——截图是二进制文件，一旦需要 rebase 就无法自动合并。
#
# 触发来源有两个：推送到 main（人手推送），以及 PR 合并后由
# feature-to-main.yml 用 workflow_dispatch 点名触发（因为 GITHUB_TOKEN 的 push
# 不会触发工作流）。后者刚推完 main，Vercel 还在构建，所以截图前要等部署完成。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 与 main-sync 共用一个组：两者都会改写 README，串行跑才不会互相覆盖
concurrency:
  group: readme-writer
  cancel-in-progress: false

jobs:
  capture:
    name: 抓取首页截图并提交
    # 机器人自己推的截图提交带 [skip-shot] 标记，且 actor 是 github-actions[bot]，
    # 两种情况都跳过，避免「提交 → 触发 → 再提交」的自我循环。
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip-shot]') && github.actor != 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 配置 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 等待站点部署完成
        # 截图抓的是线上站点，Vercel 收到推送后要重新构建再发布。不等部署完成就
        # 截图，拍到的会是上一个版本。判据：/data/projects.json 里的 generatedAt
        # 由构建时的解析器写入，它晚于本次提交时间，说明这次改动已经上线。
        env:
          DEPLOY_READY_URL: https://cityu-hub.bond/data/projects.json
        run: |
          set -euo pipefail
          git fetch -q origin main
          commit_epoch="$(git log -1 --format=%ct origin/main)"
          target=$((commit_epoch - 60))
          deadline=$(( $(date +%s) + 900 ))

          while [ "$(date +%s)" -lt "$deadline" ]; do
            generated="$(curl -fsS --max-time 20 "$DEPLOY_READY_URL" 2>/dev/null | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).generatedAt??""))}catch{process.stdout.write("")}})' || true)"

            if [ -n "$generated" ]; then
              built_epoch="$(node -e 'const t=Date.parse(process.argv[1]);process.stdout.write(Number.isNaN(t)?"0":String(Math.floor(t/1000)))' "$generated" 2>/dev/null || echo 0)"
              if [ "$built_epoch" -ge "$target" ]; then
                echo "站点已更新到本次提交：generatedAt=${generated}"
                exit 0
              fi
              echo "部署尚未完成：generatedAt=${generated}（${built_epoch} < ${target}），15 秒后再查"
            else
              echo "站点暂不可达，15 秒后再查"
            fi
            sleep 15
          done

          echo "警告：等待部署超时（15 分钟），按当前线上版本截图" >&2

      - name: 抓取截图并在最新远端基线上提交
        env:
          SITE_URL: https://cityu-hub.bond/
        run: |
          set -euo pipefail

          # 生成期间远端可能又有提交，push 会被拒；此时重新对齐基线再生成一次。
          # 每轮都从 origin/main 重新开始，因此不会累积出需要 rebase 的本地提交。
          for attempt in 1 2 3; do
            echo "=== 第 ${attempt} 次尝试 ==="

            git fetch origin main
            git reset --hard origin/main

            node scripts/update-screenshot.mjs

            if git diff --quiet -- web/public/screenshot.png README.md; then
              echo "截图与标注都没有变化，跳过提交"
              exit 0
            fi

            git add web/public/screenshot.png README.md
            git commit -m "chore(screenshot): 更新站点首页截图 [skip-shot]"

            if git push origin main; then
              echo "已推送到 main"
              exit 0
            fi

            echo "推送被拒：远端在生成期间有了新提交，重新对齐后重试"
            sleep 5
          done

          echo "连续 3 次推送失败，放弃" >&2
          exit 1
